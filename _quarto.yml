project:
  type: website
  output-dir: _site
  pre-render: scripts/build_graph.py

website:
  title: "Status Quo"
  description: "Society’s existing states of affairs in law, policy, politics, and culture. An interconnected blog by Neeraj Paulose Raj."
  site-url: "https://statusquotoday.substack.com"
  navbar:
    background: "#0f172a"
    foreground: "#f8fafc"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Graph View"
        href: graph.qmd
      - text: "Law"
        href: law/index.qmd
      - text: "Society"
        href: society/index.qmd
    right:
      - text: "About"
        href: about.qmd
      - text: "Substack ↗"
        href: https://statusquotoday.substack.com

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    toc: true
    toc-depth: 3
    search: true
    smooth-scroll: true
